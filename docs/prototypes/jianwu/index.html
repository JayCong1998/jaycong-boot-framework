:root{--accent:#c45127;--ink:#252723;--muted:#686b63;--line:#e5e6df;--bg:#f7f8f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}button{border:1px solid var(--line);background:white;color:inherit;padding:10px 20px;border-radius:5px;transition:background .18s}button:hover{background:#eeefe8}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.primary:hover{background:#a8401c}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bb784f;outline-offset:3px}a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}.wrap{max-width:1200px;margin:auto;padding:0 24px}.top{font-size:12px;border-bottom:1px solid var(--line);background:#f0f1eb;color:var(--muted)}.flex{display:flex;align-items:center;gap:22px}.between{justify-content:space-between}.top .wrap{height:35px}header{background:white}.brand{font-size:30px;font-weight:700;letter-spacing:5px}.brand small{display:block;font-size:9px;letter-spacing:4px;font-weight:400;line-height:1}.head{height:104px}.search{display:flex;width:450px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px}.search input{width:100%;border:0;background:transparent;padding:7px 12px;min-width:0}nav{border-top:1px solid #f3f3ef;border-bottom:1px solid var(--line)}nav .wrap{display:flex;gap:40px;height:53px;align-items:center}nav a.active{color:var(--accent);font-weight:bold}main{min-height:65vh;padding:28px 0 64px}.eyebrow{letter-spacing:3px;color:var(--accent);font-size:11px}.muted{color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:42px;line-height:1.4;font-weight:500}h2{font-size:25px;font-weight:500}h3{font-size:17px;font-weight:500}.hero{min-height:380px;background:#e9ecdf;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:48px 58px;overflow:hidden;border-radius:8px}.hero p{color:var(--muted);margin:16px 0 30px}.hero .art{height:290px}.art{position:relative;background:#eeeee8;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:5px}.art svg{width:75%;height:80%;filter:drop-shadow(7px 20px 12px #0002)}.hero .art{background:transparent}.art:after{content:'';position:absolute;width:160px;height:26px;border-radius:50%;background:#00000008;bottom:15%}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:22px 0 44px}.category{background:white;border:1px solid var(--line);padding:22px;text-align:left;display:flex;justify-content:space-between;align-items:center}.category b{display:block;font-size:17px;font-weight:500}.category span{font-size:12px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:36px 0 20px}.sectionhead h2{margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.product{cursor:pointer}.product .art{height:220px;transition:background .2s}.product:hover .art{background:#e5e8dc}.product h3{margin:15px 0 2px}.product p{font-size:12px;margin:0 0 8px;color:var(--muted)}.price{color:var(--accent);font-size:20px;font-weight:600}.tag{font-size:11px;color:#52634c;background:#e8edde;padding:3px 8px;border-radius:3px}.service{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:1px solid var(--line);margin-top:48px;padding:30px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:12px}.panel{background:white;border:1px solid var(--line);padding:28px;border-radius:6px;margin-bottom:20px}.crumb{font-size:12px;color:var(--muted);margin-bottom:25px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:60px}.detail>.art{height:440px}.detail h1{font-size:30px}.detail .price{font-size:32px}.option{border-color:var(--accent);color:var(--accent);background:#fcf1e9}.row{margin:22px 0}.quantity{display:inline-flex;align- </style></head><body><div class="top"><div class="wrap flex between"><span class="muted">好物不必繁杂，刚好就好。</span><div class="flex"><a href="#login" id="userlink">登录 / 注册</a><a href="#orders">我的订单</a><a href="#profile">个人中心</a></div></div></div><header><div class="wrap flex between head"><a class="brand" href="#home">简物<span style="color:var(--accent)">.</span><small>JIANWU · EVERYDAY</small></a><form class="search" id="search"><input aria-label="搜索商品" id="query" placeholder="搜索一件让生活更好的物品"><button class="primary">搜索</button></form><a href="#cart">购物袋 <span class="tag" id="count">0</span></a></div><nav><div class="wrap" id="nav"></div></nav></header><main class="wrap" id="app"></main><footer><div class="wrap flex between"><span><b>简物 JIANWU</b>　少一点繁杂，多一点喜欢。</span><span>用户端交互原型 · 演示数据 · 不产生真实交易</span></div></footer><div id="toast" role="status"></div><dialog id="modal"><div id="modalbody"></div><button onclick="document.getElementById('modal').close()">关闭</button></dialog><script>
const products=[{id:1,name:'轻量双模无线鼠标',desc:'握感舒适，让灵感自在流动',price:129,cat:'数码配件',type:'mouse',color:'#575e51',bg:'#e8ebdf',stock:86},{id:2,name:'柔光桌面台灯',desc:'一束柔光，陪伴专注时光',price:169,cat:'桌面办公',type:'lamp',color:'#d2ab77',bg:'#efe9df',stock:42},{id:3,name:'随行保温杯',desc:'把温度留给每一个日常',price:89,cat:'生活好物',type:'cup',color:'#a3ad91',bg:'#e8eade',stock:56},{id:4,name:'原点机械键盘',desc:'每一次敲击，都恰到好处',price:299,cat:'数码配件',type:'keyboard',color:'#c5bdae',bg:'#eeeae4',stock:25},{id:5,name:'简约桌面收纳盒',desc:'让桌面和思绪一样清晰',price:59,cat:'桌面办公',type:'box',color:'#bc8865',bg:'#efe5db',stock:32},{id:6,name:'便携蓝牙音箱',desc:'喜欢的旋律，随处发生',price:199,cat:'数码配件',type:'speaker',color:'#62756b',bg:'#e3e9e3',stock:18},{id:7,name:'日常帆布托特包',desc:'装得下生活，也装得下喜欢',price:79,cat:'生活好物',type:'bag',color:'#c7bc9e',bg:'#ede9df',stock:0},{id:8,name:'软木桌面垫',desc:'温润触感，安放每一份热爱',price:69,cat:'桌面办公',type:'mat',color:'#b18c64',bg:'#ebe4da',stock:63}];
function art(p){let shapes={mouse:`<path d="M100 150c0-105 120-105 120 0v30c0 85-120 85-120 0z" fill="${p.color}"/><path d="M160 78v70" stroke="#ffffff60" stroke-width="2"/><rect x="153" y="99" width="14" height="30" rx="7" fill="#252b24"/>`,lamp:`<ellipse cx="161" cy="249" rx="68" ry="13" fill="${p.color}"/><path d="M160 242V135l38-55" fill="none" stroke="${p.color}" stroke-width="12"/><path d="M120 130q-10-65 55-75 50 5 53 70z" fill="${p.color}"/><ellipse cx="174" cy="128" rx="54" ry="12" fill="#ffefd1"/>`,cup:`<rect x="115" y="78" width="92" height="175" rx="25" fill="${p.color}"/><rect x="111" y="69" width="100" height="27" rx="10" fill="#59674f"/><path d="M132 110v103" stroke="#ffffff50" stroke-width="6"/><text x="160" y="178" text-anchor="middle" fill="#fff9" font-size="12">JIANWU</text>`,keyboard:`<rect x="35" y="108" width="250" height="112" rx="13" fill="${p.color}" transform="rotate(-8 160 160)"/>${Array.from({length:50},(_,i)=>`<rect x="${47+i%10*23}" y="${119+Math.floor(i/10)*18}" width="18" height="13" rx="3" fill="${i%9===0?'#777f6b':'#f6f2e8'}" transform="rotate(-8 160 160)"/>`).join('')}`,box:`<path d="M65 120l165-25 32 45v90L95 250 65 210z" fill="${p.color}"/><path d="M65 120l33 40 164-20M98 160v90" fill="none" stroke="#ffffff50" stroke-width="3"/><rect x="151" y="172" width="60" height="18" rx="4" fill="#59432e"/>`,speaker:`<rect x="84" y="105" width="154" height="132" rx="24" fill="${p.color}"/><circle cx="161" cy="171" r="43" fill="#243d3540" stroke="#b6c1b5" stroke-width="2"/><circle cx="161" cy="171" r="25" fill="#233f3740"/><path d="M111 107V90q50-60 100 0v17" fill="none" stroke="${p.color}" stroke-width="9"/>`,bag:`<path d="M87 117h150l13 135H74z" fill="${p.color}"/><path d="M122 132V90q40-55 78 0v42" fill="none" stroke="#8b8267" stroke-width="12"/><text x="161" y="200" text-anchor="middle" fill="#68614c" font-size="18">EVERYDAY</text>`,mat:`<path d="M39 133l204-38 45 107-207 42z" fill="${p.color}"/><path d="M47 138l194-36 37 95-195 39z" fill="none" stroke="#dfc49e"/>`};return `<div class="art" style="background:${p.bg}" role="img" aria-label="${p.name}示意图"><svg viewBox="0 0 320 320" aria-hidden="true">${shapes[p.type]}</svg></div>`}
let state;try{state=JSON.parse(localStorage.getItem('jianwu-prototype-v1'))}catch{}state=state||{user:'',cart:[],orders:[],addresses:[{name:'林小满',phone:'13800138001',region:'上海市 徐汇区',detail:'示例路 88 号 3 栋 602 室',default:true}]};let filter='全部订单',selectedColor='自然色',selectedVersion='标准版',qty=1,currentOrder=null,returnTo='';const app=document.getElementById('app'),money=n=>'¥'+n.toFixed(2),save=()=>{try{localStorage.setItem('jianwu-prototype-v1',JSON.stringify(state))}catch{}},pof=id=>products.find(p=>p.id===+id),cartTotal=()=>state.cart.filter(x=>x.checked).reduce((s,x)=>s+pof(x.id).price*x.qty,0);let toastTimer;
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',2500)}function go(v){location.hash=v}function protect(target){if(!state.user){returnTo=target;go('login');return false}return true}function card(p){return `<article class="product" tabindex="0" role="link" onclick="go('product/${p.id}')" onkeydown="if(event.key==='Enter')go('product/${p.id}')">${art(p)}<h3>${p.name}</h3><p>${p.desc}</p><div class="flex between"><span class="price">${money(p.price)}</span><span class="tag">${p.stock?'精选好物':'暂时缺货'}</span></div></article>`}function btn(t,f,primary=false){return `<button class="${primary?'primary':''}" onclick="${f}">${t}</button>`}function sidebar(active){return `<aside class="sidebar"><h3>我的简物</h3>${[['orders','我的订单'],['addresses','收货地址'],['profile','个人资料'],['security','账号安全']].map(([k,v])=>`<a class="${active===k?'active':''}" href="#${k}">${v}</a>`).join('')}</aside>`}function shell(active,body){return `<div class="crumb">首页 / 个人中心</div><div class="layout">${sidebar(active)}<section class="panel">${body}</section></div>`}function empty(t){return `<div class="empty"><h3>${t}</h3><p>去发现一些让日常更好的物品吧。</p>${btn('去逛逛',"go('list')",true)}</div>`}
function render(){let parts=(location.hash.slice(1)||'home').split('/'),page=parts[0],id=parts[1];document.getElementById('userlink').textContent=state.user||'登录 / 注册';document.getElementById('userlink').href=state.user?'#profile':'#login';document.getElementById('count').textContent=state.cart.reduce((s,x)=>s+x.qty,0);document.getElementById('nav').innerHTML=[['home','首页'],['list','全部商品'],['list/数码配件','数码配件'],['list/桌面办公','桌面办公'],['list/生活好物','生活好物']].map(([k,v])=>`<a href="#${k}" class="${(location.hash.slice(1)||'home')===k?'active':''}">${v}</a>`).join('');if(['cart','checkout','pay','result','orders','order','profile','addresses','security'].includes(page)&&!protect(location.hash.slice(1)))return;
if(page==='home'){app.innerHTML=`<section class="hero"><div><div class="eyebrow">LESS, BUT BETTER / 简物日常</div><h1 style="margin:18px 0">让日常，<br>多一点好用。</h1><p>精选数码与生活好物。<br>不追逐繁杂，只留下真正喜欢的。</p>${btn('探索日常好物　→',"go('list')",true)}</div>${art(products[1])}</section><div class="categories">${['数码配件','桌面办公','生活好物'].map((c,i)=>`<button class="category" onclick="go('list/${c}')"><div><b>${c}</b><span>${['灵感在线，自在连接','留一方专注的空间','把喜欢放进日常'][i]}</span></div>↗</button>`).join('')}</div><div class="sectionhead"><div><span class="eyebrow">CURATED FOR YOU</span><h2>刚好，是你喜欢的</h2></div><a href="#list">查看全部 →</a></div><div class="grid">${products.slice(0,4).map(card).join('')}</div><div class="sectionhead"><div><span class="eyebrow">NEW ARRIVALS</span><h2>给生活一点新意</h2></div><span class="muted">新近上架 · 慢慢挑选</span></div><div class="grid">${products.slice(4).map(card).join('')}</div><div class="service"><div>精选品质<br><small>每一件，都用心挑选</small></div><div>全场包邮<br><small>简单购物，无需凑单</small></div><div>安心体验<br><small>清晰价格，轻松选购</small></div></div>`}
else if(page==='list'){app.innerHTML=`<div class="crumb">首页 / 全部商品</div><div class="sectionhead"><h2>${id?decodeURIComponent(id):'发现日常好物'}</h2><span class="muted">每一件，都值得留在生活里。</span></div><div class="panel"><div class="toolbar"><span>分类</span><select id="category" aria-label="商品分类"><option>全部分类</option>${['数码配件','桌面办公','生活好物'].map(c=>`<option ${decodeURIComponent(id||'')===c?'selected':''}>${c}</option>`).join('')}</select><span>排序</span><select id="sort" aria-label="商品排序"><option value="default">综合推荐</option><option value="asc">价格从低到高</option><option value="desc">价格从高到低</option></select><span class="muted" id="results"></span></div></div><div class="grid" id="listing"></div><div class="pager"><button class="option">1</button><span class="note">　共 1 页</span></div>`;document.getElementById('category').onchange=list;document.getElementById('sort').onchange=list;list()}
else if(page==='product'){let p=pof(id);if(!p){go('list');return}qty=1;selectedColor='自然色';selectedVersion='标准版';app.innerHTML=`<div class="crumb"><a href="#home">首页</a> / <a href="#list/${p.cat}">${p.cat}</a> / ${p.name}</div><div class="detail">${art(p)}<div><span class="eyebrow">JIANWU SELECTED</span><h1 style="margin:12px 0">${p.name}</h1><p class="muted">${p.desc}</p><div class="panel" style="background:#f0f1e9;border:0"><span class="price">${money(p.price)}</span><span class="muted">　全场包邮</span></div><div class="row">颜色　 <button class="option color" onclick="choose(this,'color','自然色')">自然色</button> <button class="color" onclick="choose(this,'color','曜石黑')">曜石黑</button></div><div class="row">版本　 <button class="option version" onclick="choose(this,'version','标准版')">标准版</button></div><div class="row">数量　 <div class="quantity"><button aria-label="减少数量" onclick="changeQty(-1,${p.stock})">−</button><span id="qty">1</span><button aria-label="增加数量" onclick="changeQty(1,${p.stock})">+</button></div><span class="muted">　${p.stock?'库存 '+p.stock+' 件':'暂时缺货'}</span></div><div class="flex"><button ${p.stock?'':'disabled'} onclick="add(${p.id})">加入购物袋</button><button class="primary" ${p.stock?'':'disabled'} onclick="buy(${p.id})">立即购买</button></div><p class="note" style="margin-top:25px">精选品质　/　全场包邮　/　明码标价</p></div></div><div class="panel" style="margin-top:35px"><h3>商品介绍</h3><p>${p.desc}。以简洁外观和实用设计，为你的日常留出更多舒适空间。</p><hr style="border:0;border-top:1px solid var(--line)"><h3>规格参数</h3><p class="muted">品牌：简物　　版本：标准版　　包装清单：商品 × 1、使用说明 × 1</p><p class="note">图片为原型示意图，商品信息为演示数据。</p></div>`}

else if(page==='result'){let o=state.orders.find(o=>o.id===id);app.innerHTML=`<section class="panel center" style="padding:65px"><div class="badge">✓</div><h2>支付成功，谢谢你的喜欢</h2><p class="muted">我们会用心准备，让好物早一点来到你身边。</p><p>实付 <b class="price">${money(o?.total||0)}</b></p>${btn('查看订单',`go('order/${id}')`,true)}　${btn('继续逛逛',"go('list')")}</section>`}
else if(page==='orders'){expire();let orders=state.orders.filter(o=>filter==='全部订单'||o.status===filter);app.innerHTML=shell('orders',`<h2>我的订单</h2><div class="tabs">${['全部订单','待付款','待发货','待收货','已完成','已取消'].map(t=>`<button class="${t===filter?'selected':''}" onclick="filter='${t}';render()">${t}${t==='全部订单'?' ('+state.orders.length+')':''}</button>`).join('')}</div>${orders.length?orders.map(orderCard).join(''):empty('暂无'+(filter==='全部订单'?'':filter)+'订单')}<div class="note">原型体验：${btn('加载各状态示例订单','seedOrders()')}　只添加演示记录，不触发真实交易。</div>`)}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function list(){let c=document.getElementById('category').value,q=document.getElementById('query').value.trim(),s=document.getElementById('sort').value;let arr=products.filter(p=>(c==='全部分类'||p.cat===c)&&(!q||(p.name+p.desc+p.cat).includes(q)));if(s!=='default')arr.sort((a,b)=>s==='asc'?a.price-b.price:b.price-a.price);document.getElementById('results').textContent=`共 ${arr.length} 件商品`;document.getElementById('listing').innerHTML=arr.length?arr.map(card).join(''):`<div style="grid-column:1/-1" class="empty"><h3>没有找到相关好物</h3><p>换个关键词，或清除筛选再试试。</p>${btn('清除筛选',"document.getElementById('query').value='';document.getElementById('category').value='全部分类';list()")}</div>`}function choose(el,type,v){document.querySelectorAll('.'+type).forEach(x=>x.classList.remove('option'));el.classList.add('option');if(type==='color')selectedColor=v;else selectedVersion=v}function changeQty(d,max){qty=Math.max(1,Math.min(max,qty+d));document.getElementById('qty').textContent=qty}function add(id,silent=false){if(!protect('product/'+id))return false;let p=pof(id);if(!p.stock)return false;let x=state.cart.find(x=>x.id===id&&x.color===selectedColor&&x.version===selectedVersion);if(x)x.qty=Math.min(p.stock,x.qty+qty);else state.cart.push({id,qty,color:selectedColor,version:selectedVersion,checked:true});save();document.getElementById('count').textContent=state.cart.reduce((s,x)=>s+x.qty,0);if(!silent)toast('已加入购物袋，可前往购物袋结算');return true}function buy(id){if(!protect('product/'+id))return;state.cart.forEach(x=>x.checked=false);if(add(id,true)){state.cart.find(x=>x.id===id&&x.color===selectedColor&&x.version===selectedVersion).checked=true;save();go('checkout')}}function cartQty(i,d){state.cart[i].qty=Math.max(1,Math.min(pof(state.cart[i].id).stock,state.cart[i].qty+d));save();render()}function login(e,reg){e.preventDefault();let a=document.getElementById('account').value.trim();if(!/^1\d{10}$/.test(a)&&!/^\S+@\S+\.\S+$/.test(a)){toast('请输入有效的手机号或邮箱');return}state.user='简物体验官';save();go(returnTo||'home');returnTo='';toast(reg?'注册成功，欢迎来到简物':'登录成功，欢迎回来')}
function submitOrder(el){let selected=state.cart.filter(x=>x.checked);if(!selected.length)return;let a=document.querySelector('input[name="address"]:checked');if(!a){toast('请选择收货地址');return}el.disabled=true;let o={id:'JW'+Date.now(),date:new Date().toLocaleString('zh-CN'),deadline:Date.now()+900000,status:'待付款',items:structuredClone(selected),address:structuredClone(state.addresses[+a.value]),remark:document.getElementById('remark').value,total:cartTotal()};state.orders.unshift(o);state.cart=state.cart.filter(x=>!x.checked);save();go('pay/'+o.id)}function expire(){let changed=false;state.orders.forEach(o=>{if(o.status==='待付款'&&o.deadline<=Date.now()){o.status='已取消';o.reason='超过 15 分钟未支付，订单已自动关闭';changed=true}});if(changed)save()}function tick(){expire();let id=location.hash.split('/')[1],o=state.orders.find(x=>x.id===id),el=document.getElementById('timer');if(el&&o){if(o.status!=='待付款'){render();return}let s=Math.max(0,Math.ceil((o.deadline-Date.now())/1000));el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}}setInterval(tick,1000);function pay(id){expire();let o=state.orders.find(o=>o.id===id);if(o.status!=='待付款'){render();toast('订单已关闭');return}o.status='待发货';save();go('result/'+id)}function updateOrder(id,status){let o=state.orders.find(o=>o.id===id);o.status=status;if(status==='已取消')o.reason='用户主动取消订单';save();render();toast(status==='已完成'?'已确认收货':'订单已取消')}function askOrder(id,status){document.getElementById('modalbody').innerHTML=`<h3>${status==='已取消'?'确认取消订单？':'确认已收到商品？'}</h3><p class="muted">${status==='已取消'?'取消后可重新挑选商品下单。':'请收到商品并核对无误后再确认。'}</p>${btn('确认',`updateOrder('${id}','${status}');document.getElementById('modal').close()`,true)} `;document.getElementById('modal').showModal()}function actions(o){return (o.status==='待付款'?btn('去支付',`go('pay/${o.id}')`,true)+' '+btn('取消订单',`askOrder('${o.id}','已取消')`):o.status==='待收货'?btn('确认收货',`askOrder('${o.id}','已完成')`,true):['已完成','已取消'].includes(o.status)?btn('再次购买',`again('${o.id}')`):'') }function orderCard(o,withActions=true){return `<article class="order"><div class="orderhead"><span>${o.date}　订单号 ${o.id}</span><b style="color:var(--accent)">${o.status}</b></div>${o.items.map(x=>`<div class="orderbody">${art(pof(x.id))}<div class="grow"><a href="#product/${x.id}">${pof(x.id).name}</a><div class="note">${x.color} / ${x.version} × ${x.qty}</div></div><b>${money(pof(x.id).price*x.qty)}</b></div>`).join('')}<div class="orderbody" style="border-top:1px solid var(--line)"><span class="grow">合计 <b>${money(o.total)}</b> <small class="muted">含运费 ¥0.00</small></span>${withActions?`<a href="#order/${o.id}">查看详情</a>${actions(o)}`:''}</div></article>`}function again(id){let o=state.orders.find(x=>x.id===id);o.items.forEach(x=>{if(pof(x.id).stock){let existing=state.cart.find(c=>c.id===x.id&&c.color===x.color&&c.version===x.version);if(existing){existing.qty=Math.min(pof(x.id).stock,existing.qty+x.qty);existing.checked=true}else state.cart.push({...x,qty:Math.min(x.qty,pof(x.id).stock),checked:true})}});save();go('cart');toast('已按当前库存加入购物袋，请确认价格与数量')}function seedOrders(){if(state.orders.some(o=>o.sample)){toast('示例订单已加载');return}['待付款','待发货','待收货','已完成','已取消'].forEach((s,i)=>state.orders.push({id:'DEMO'+(1001+i),sample:true,date:'2026/11/09 10:30',deadline:Date.now()+900000,status:s,items:[{id:i+1,qty:1,color:'自然色',version:'标准版'}],total:products[i].price,address:{name:'林小满',phone:'13800138001',region:'上海市 徐汇区',detail:'示例路 88 号'},remark:'演示订单'}));save();render();toast('已加载 5 种状态的示例订单')}
function addressForm(i=-1){let a=i<0?{}:state.addresses[i];document.getElementById('modalbody').innerHTML=`<h2>${i<0?'新增':'编辑'}收货地址</h2><form class="form" onsubmit="saveAddress(event,${i})">${[['name','收货人'],['phone','手机号码'],['region','省 / 市 / 区'],['detail','详细地址']].map(([k,t])=>`<label for="a_${k}">${t}</label><input class="field" id="a_${k}" value="${esc(a[k]||'')}" required maxlength="100">`).join('')}<label><input id="a_default" type="checkbox" ${a.default?'checked':''}> 设为默认地址</label><button class="primary">保存地址</button></form>`;document.getElementById('modal').showModal()}function saveAddress(e,i){e.preventDefault();let a={};for(let k of ['name','phone','region','detail'])a[k]=document.getElementById('a_'+k).value.trim();if(Object.values(a).some(x=>!x)){toast('请完整填写地址');return}if(!/^1\d{10}$/.test(a.phone)){toast('请输入 11 位手机号码');return}a.default=document.getElementById('a_default').checked||state.addresses.length===0;if(a.default)state.addresses.forEach(x=>x.default=false);if(i<0)state.addresses.push(a);else state.addresses[i]=a;state.addresses.sort((a,b)=>Number(b.default)-Number(a.default));save();document.getElementById('modal').close();render();toast('地址已保存')}function removeAddress(i){document.getElementById('modalbody').innerHTML=`<h3>确认删除该地址？</h3>${btn('确认删除',`state.addresses.splice(${i},1);if(state.addresses.length&&!state.addresses.some(a=>a.default))state.addresses[0].default=true;save();document.getElementById('modal').close();render()`,true)}`;document.getElementById('modal').showModal()}function setDefault(i){state.addresses.forEach((a,j)=>a.default=i===j);state.addresses.sort((a,b)=>Number(b.default)-Number(a.default));save();render()}document.getElementById('search').onsubmit=e=>{e.preventDefault();if(location.hash==='#list')list();else go('list')};window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
