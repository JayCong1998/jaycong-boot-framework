springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    disable-swagger-default-url: true
    urls:
      - name: Auth 认证服务
        url: /openapi/auth
      - name: Admin 后台管理服务
        url: /openapi/admin

server:
  port: 8090

jaycong:
  gateway:
    access-log:
      enabled: true

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:application}] [%thread] [requestId=%X{requestId:-}] %logger{40} - %msg%n%wEx"
  level:
    root: INFO
    io.github.jaycong: INFO
    reactor.netty.http.server.AccessLog: INFO

spring:
  config:
    import:
      - classpath:bootstrap.yml
  data:
    redis:
      host: ${AUTH_REDIS_HOST:localhost}
      port: ${AUTH_REDIS_PORT:6379}
      password: ${AUTH_REDIS_PASSWORD:}
      database: ${AUTH_REDIS_DATABASE:0}
      connect-timeout: 3s
      timeout: 3s
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          # 保留原请求路径，业务服务无需增加网关专用前缀。
          routes:
            # 只转发文档 JSON，不扩大业务服务内部 RPC 的公开范围。
            - id: auth-api-docs
              uri: lb://auth
              predicates:
                - Path=/openapi/auth
              filters:
                - SetPath=/v3/api-docs
            - id: admin-api-docs
              uri: lb://admin
              predicates:
                - Path=/openapi/admin
              filters:
                - SetPath=/v3/api-docs
            - id: order
              uri: lb://order
              predicates:
                - Path=/orders,/orders/**
            - id: goods
              uri: lb://goods
              predicates:
                - Path=/goods,/goods/**
            - id: admin
              uri: lb://admin
              predicates:
                - Path=/admin,/admin/**
            - id: auth
              uri: lb://auth
              predicates:
                - Path=/auth,/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-read-cookie: false
  is-read-body: false
  is-log: false
  token-style: uuid
  is-share: false
  token-session-check-login: true
